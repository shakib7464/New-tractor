name: Build Araaf Tractor Khata APK

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform packages
        run: sdkmanager "platforms;android-36" "platforms;android-36.1"

      - name: Find or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "No Android project or source ZIP found in repository root." >&2
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/aaraaf-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaraaf-source"
            PROJECT_FILE="$(find "$RUNNER_TEMP/aaraaf-source" -type f -path '*/app/build.gradle.kts' -print -quit)"
            if [[ -z "$PROJECT_FILE" ]]; then
              echo "ZIP does not contain app/build.gradle.kts." >&2
              exit 1
            fi
            PROJECT_DIR="$(dirname "$(dirname "$PROJECT_FILE")")"
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" :app:assembleDebug --no-daemon

      - name: Print APK signing SHA-1 (Google login setup)
        shell: bash
        run: |
          APK="${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "### APK signing certificate (Google Cloud OAuth-এ এই SHA-1 দিন)"
            echo '```'
            keytool -printcert -jarfile "$APK" | grep -E "SHA1|SHA256" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
