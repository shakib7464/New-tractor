name: Build APK from ZIP

on:
  push:
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: write

env:
  # In-app update ei public repo-র Releases থেকে APK নেয়
  PUBLIC_REPO: shakib7464/Araaf-tractor-khata

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" || true

      - name: Find project (root, subfolder or newest ZIP)
        id: project
        run: |
          set -e
          if [[ -f app/build.gradle.kts ]]; then
            DIR="$GITHUB_WORKSPACE"
          else
            FOUND="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -path '*/app/build.gradle.kts' -not -path '*/.git/*' -print -quit)"
            if [[ -z "$FOUND" ]]; then
              ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -iname '*.zip' | sort -V | tail -n1)"
              [[ -n "$ZIP" ]] || { echo "::error::No project or ZIP found"; exit 1; }
              echo "Using ZIP: $(basename "$ZIP")"
              mkdir -p "$RUNNER_TEMP/src"
              unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
              FOUND="$(find "$RUNNER_TEMP/src" -path '*/app/build.gradle.kts' -print -quit)"
              [[ -n "$FOUND" ]] || { echo "::error::app/build.gradle.kts not in ZIP"; exit 1; }
            fi
            DIR="$(dirname "$(dirname "$FOUND")")"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Version code and update repo
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ -n "$RELEASE_TOKEN" ]]; then
            echo "UPDATE_REPO=$PUBLIC_REPO" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_TOKEN secret not set; release will be published in this (private) repo and in-app update will not work."
            echo "UPDATE_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" :app:assemblePreview --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC="$(find "${{ steps.project.outputs.dir }}/app/build/outputs/apk/preview" -name '*.apk' -print -quit)"
          OUT="$RUNNER_TEMP/Araaf-Tractor-Khata-build${VERSION_CODE}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-(1|256)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OWN_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${VERSION_CODE}"
          if [[ -n "$RELEASE_TOKEN" ]]; then
            export GH_TOKEN="$RELEASE_TOKEN"; REPO="$PUBLIC_REPO"; TARGET=()
          else
            export GH_TOKEN="$OWN_TOKEN"; REPO="$GITHUB_REPOSITORY"; TARGET=(--target "$GITHUB_SHA")
          fi
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" --repo "$REPO" "${TARGET[@]}" --title "Build ${VERSION_CODE}" --notes "" --latest
          echo "Published $TAG to $REPO" >> "$GITHUB_STEP_SUMMARY"
