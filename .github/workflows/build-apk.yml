name: Build APK

on:
  push:
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" || true

      - name: Find project
        id: project
        run: |
          if [[ -f app/build.gradle.kts ]]; then DIR="$GITHUB_WORKSPACE"
          else DIR="$(dirname "$(dirname "$(find "$GITHUB_WORKSPACE" -maxdepth 4 -path '*/app/build.gradle.kts' -not -path '*/.git/*' -print -quit)")")"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Version code
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" :app:assemblePreview --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC="$(find "${{ steps.project.outputs.dir }}/app/build/outputs/apk/preview" -name '*.apk' -print -quit)"
          OUT="$RUNNER_TEMP/Araaf-Tractor-Khata-build${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-(1|256)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${VERSION_CODE}"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" --target "$GITHUB_SHA" --title "Build ${VERSION_CODE}" --notes "" --latest
