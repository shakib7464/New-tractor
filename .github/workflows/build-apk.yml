name: Build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # In-app updater এর জন্য public রিপোজিটরি দিতে চাইলে Settings > Variables এ UPDATE_REPO (owner/repo) বসান
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Latest ZIP unzip
        run: |
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"
          ZIP=$(ls Aaraaf-Tractor-Khata-updated-v*.zip | sort -V | tail -n 1)
          echo "Using: $ZIP"
          mkdir -p build_src
          unzip -q "$ZIP" -d build_src
          PROJECT=$(dirname "$(find build_src -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*outputs/apk/debug/*.apk' | head -n 1)
          VNAME=$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)
          mkdir -p dist
          cp "$APK" "dist/Araaf-Tractor-Khata-v${VNAME}-build${VERSION_CODE}.apk"
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-APK
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" dist/*.apk \
            --title "Araaf Tractor Khata v${VNAME} (build ${VERSION_CODE})" \
            --notes "Automatic build from ${GITHUB_SHA::7}"
