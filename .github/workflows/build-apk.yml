
name: Build APK

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Extract Latest ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

          ZIP=$(find . -type f \
            -iname '*tractor*khata*.zip' \
            -not -path './.git/*' \
            -not -path './build_src/*' |
            sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Tractor Khata ZIP not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          mkdir -p build_src
          unzip -q "$ZIP" -d build_src

          SETTINGS=$(find build_src \
            -name settings.gradle.kts \
            -not -path '*/node_modules/*' |
            head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found inside ZIP"
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Preview APK
        run: |
          cd "$PROJECT_DIR"
          gradle assemblePreview --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -path '*/outputs/apk/preview/*.apk' |
            head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Preview APK not created"
            exit 1
          fi

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi

          VNAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE_FILE" | head -n 1)

          if [ -z "$VNAME" ]; then
            echo "::error::versionName not found"
            exit 1
          fi

          APK_NAME="Araaf-Tractor-Khata-v${VNAME}-build${VERSION_CODE}.apk"

          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"

          echo "VNAME=$VNAME" >> "$GITHUB_ENV"

          SIZE=$(stat -c %s "dist/$APK_NAME")

          cat > dist/latest.json <<JSON
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VNAME}",
            "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${VERSION_CODE}/${APK_NAME}",
            "sizeBytes": ${SIZE},
            "notes": ""
          }
          JSON

          cat dist/latest.json

      - name: Print APK Signing SHA-1
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          {
            echo "## APK Signing Certificate"
            echo
            echo "Version: v${VNAME} (build ${VERSION_CODE})"
            echo
            echo '```'
            "$APKSIGNER" verify --print-certs dist/*.apk |
              grep -E 'SHA-(1|256) digest' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" \
            dist/*.apk dist/latest.json \
            --target "$GITHUB_SHA" \
            --title "Araaf Tractor Khata v${VNAME} (build ${VERSION_CODE})" \
            --notes "Automatic build from ${GITHUB_SHA::7}"
