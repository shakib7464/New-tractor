name: Build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # In-app updater এর জন্য public রিপোজিটরি দিতে চাইলে Settings > Variables এ UPDATE_REPO (owner/repo) বসান
      UPDATE_REPO: ${{ vars.UPDATE_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Latest ZIP unzip
        run: |
          # build number: প্রতি মিনিটে বাড়ে, তাই আপডেট ইনস্টলে সবসময় নতুনটা বড় হয়
          echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

          ZIP=$(ls Aaraaf-Tractor-Khata-updated-v*.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Aaraaf-Tractor-Khata-updated-v*.zip রিপোর root-এ পাওয়া যায়নি"
            exit 1
          fi
          echo "Using: $ZIP"

          mkdir -p build_src
          unzip -q "$ZIP" -d build_src

          SETTINGS=$(find build_src -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP-এর ভেতরে settings.gradle.kts পাওয়া যায়নি"
            exit 1
          fi
          PROJECT=$(dirname "$SETTINGS")
          echo "Project dir: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Debug APK তৈরি হয়নি"
            exit 1
          fi
          VNAME=$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts" | head -n 1)
          APK_NAME="Araaf-Tractor-Khata-v${VNAME}-build${VERSION_CODE}.apk"
          mkdir -p dist
          cp "$APK" "dist/$APK_NAME"
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"

          # latest.json: অ্যাপ api.github.com-এর বদলে এই ছোট ফাইল পড়ে আপডেট খোঁজে (rate limit লাগে না)
          SIZE=$(stat -c %s "dist/$APK_NAME")
          cat > dist/latest.json <<JSON
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VNAME}",
            "downloadUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${VERSION_CODE}/${APK_NAME}",
            "sizeBytes": ${SIZE},
            "notes": ""
          }
          JSON
          cat dist/latest.json

      - name: Print APK signing SHA-1 (Google Login এর জন্য)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          {
            echo "## APK signing certificate"
            echo
            echo "Version: v${VNAME} (build ${VERSION_CODE})"
            echo
            echo '```'
            "$APKSIGNER" verify --print-certs dist/*.apk | grep -E 'SHA-(1|256) digest' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-APK
          path: dist/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${VERSION_CODE}" dist/*.apk dist/latest.json \
            --target "$GITHUB_SHA" \
            --title "Araaf Tractor Khata v${VNAME} (build ${VERSION_CODE})" \
            --notes "Automatic build from ${GITHUB_SHA::7}"
