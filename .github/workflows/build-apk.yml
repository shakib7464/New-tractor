name: Build Araaf Tractor Khata APK

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'APK বানানোর পর unit test চালাবেন? (ফেল করলেও APK পাওয়া যাবে)'
        type: boolean
        default: true

# একই branch-এ নতুন push এলে আগের চলমান build বাতিল হবে
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub Release বানাতে লেখার অনুমতি লাগে
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest-এ Android SDK আগে থেকেই ইনস্টল করা (ANDROID_HOME সেট), তাই আলাদা setup action লাগে না।
      # compileSdk = 36 (minorApiLevel 1) হওয়ায় android-36.1 লাগে।
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-36.1" \
            || echo "::warning::sdkmanager প্যাকেজ ইনস্টল করতে পারেনি; Gradle নিজে ডাউনলোড করার চেষ্টা করবে।"

      - name: Find or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f settings.gradle.kts && -f app/build.gradle.kts ]]; then
            # ১) প্রজেক্ট repository-র root-এই আছে
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            # ২) প্রজেক্ট repository-র কোনো সাবফোল্ডারে আছে (যেমন native_work/)
            FOUND="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -path '*/app/build.gradle.kts' \
              -not -path '*/.git/*' -not -path '*/build/*' -print -quit)"
            if [[ -n "$FOUND" ]]; then
              PROJECT_DIR="$(dirname "$(dirname "$FOUND")")"
            else
              # ৩) repository-তে শুধু source ZIP আছে
              # একাধিক ZIP থাকলে সংখ্যা ধরে সবচেয়ে নতুনটা (যেমন v25 > v23) নেওয়া হয়
              ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | sort -V | tail -n1)"
              echo "Source ZIP: ${ZIP_FILE:-নেই}"
              if [[ -z "$ZIP_FILE" ]]; then
                echo "::error::Android project বা source ZIP repository-তে পাওয়া যায়নি।"
                exit 1
              fi
              mkdir -p "$RUNNER_TEMP/aaraaf-source"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/aaraaf-source"
              FOUND="$(find "$RUNNER_TEMP/aaraaf-source" -type f -path '*/app/build.gradle.kts' -print -quit)"
              if [[ -z "$FOUND" ]]; then
                echo "::error::ZIP-এর ভেতরে app/build.gradle.kts নেই।"
                exit 1
              fi
              PROJECT_DIR="$(dirname "$(dirname "$FOUND")")"
            fi
          fi
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "::error::$PROJECT_DIR-এ settings.gradle.kts নেই।"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.project.outputs.project_dir }}"
          # preview build একই debug key দিয়ে সাইন হয়, কী না থাকলে বিল্ড ফেল করবে
          if [[ ! -f "$DIR/araaf-debug.keystore" && ! -f "$DIR/debug.keystore" ]]; then
            echo "::error::araaf-debug.keystore পাওয়া যায়নি। এটি repository-তে commit করুন (সাইন একই রাখতে)।"
            exit 1
          fi
          # প্রোফাইল বদলের রিস্টার্ট এই Activity-র উপর নির্ভর করে (v22 ফিক্স)
          if ! grep -q "RestartActivity" "$DIR/app/src/main/AndroidManifest.xml"; then
            echo "::warning::AndroidManifest.xml-এ RestartActivity নেই; প্রোফাইল বদলালে অ্যাপ বন্ধ হয়ে যেতে পারে।"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # প্রতি বিল্ডে versionCode বাড়ে (100 + run number), যাতে আগের অ্যাপের উপরে আপডেট ইনস্টল হয়
      - name: Compute version code
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build preview APK
        run: gradle -p "${{ steps.project.outputs.project_dir }}" :app:assemblePreview --stacktrace

      - name: Collect and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          DIR="${{ steps.project.outputs.project_dir }}"
          SRC="$(find "$DIR/app/build/outputs/apk/preview" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$SRC" ]]; then
            echo "::error::preview APK তৈরি হয়নি।"
            exit 1
          fi

          VERSION_NAME="$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' "$DIR/app/build.gradle.kts" | head -n1)"
          VERSION_NAME="${VERSION_NAME:-unknown}"
          mkdir -p "$RUNNER_TEMP/dist"
          OUT="$RUNNER_TEMP/dist/Araaf-Tractor-Khata-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          # apksigner দিয়ে সাইন যাচাই + SHA-1 (minSdk 24 হওয়ায় শুধু v2+ সাইন থাকে; keytool -jarfile এখানে কিছু দেখায় না)
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > "$RUNNER_TEMP/apksigner.txt" 2>&1 || {
            cat "$RUNNER_TEMP/apksigner.txt"
            echo "::error::APK-র সাইন যাচাই ফেল করেছে।"
            exit 1
          }

          SIZE="$(du -h "$OUT" | cut -f1)"
          APK_SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          {
            echo "### ✅ Araaf Tractor Khata v${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})"
            echo ""
            echo "- ফাইল: \`$(basename "$OUT")\` ($SIZE)"
            echo "- APK SHA-256: \`$APK_SHA\`"
            echo ""
            echo "#### সাইন সার্টিফিকেট (Google Cloud OAuth-এ এই SHA-1 দিন)"
            echo '```'
            grep -E "Verified using|certificate SHA-(1|256) digest" "$RUNNER_TEMP/apksigner.txt" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-preview-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # R8 চালু থাকায় ক্র্যাশ লগের নাম এলোমেলো দেখায়; এই ফাইল দিয়ে আসল লাইন বের করা যায়
      - name: Upload R8 mapping (crash log decode)
        uses: actions/upload-artifact@v4
        with:
          name: Araaf-Tractor-Khata-r8-mapping
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/mapping/preview/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      # APK আগেই আপলোড হয়ে গেছে, তাই test ফেল করলেও APK পাওয়া যাবে
      - name: Run unit tests
        id: tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        continue-on-error: true
        run: gradle -p "${{ steps.project.outputs.project_dir }}" :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests)
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/reports/tests
            ${{ steps.project.outputs.project_dir }}/app/build/test-results
          if-no-files-found: ignore
          retention-days: 14

      # অ্যাপের ভেতরের "আপডেট" বাটন এই রিলিজ থেকেই নতুন APK নামায় (শুধু মূল branch-এর push-এ)
      # unit test ফেল করলে রিলিজ "pre-release" হয়: APK ডাউনলোড করা যায়, কিন্তু অ্যাপের ভেতরের আপডেট একে দেখে না।
      - name: Publish GitHub Release (in-app update)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          TAG="build-${VERSION_CODE}"

          # একই run আবার চালালে (re-run) আগের একই tag-এর রিলিজ মুছে নতুন করে বানানো হয়
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true

          # অ্যাপের আপডেট ডায়ালগে যা দেখাবে: কোন commit, আর commit message
          MSG="$(git log -1 --pretty=%B "$GITHUB_SHA" | sed '/^[[:space:]]*$/d' | head -n 6 | cut -c1-200 || true)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.txt"
          {
            echo "অটো বিল্ড #${GITHUB_RUN_NUMBER} • commit ${GITHUB_SHA::7}"
            if [[ -n "$MSG" ]]; then
              echo ""
              echo "$MSG"
            fi
          } > "$NOTES_FILE"

          if [[ "$TEST_OUTCOME" == "failure" ]]; then
            echo "" >> "$NOTES_FILE"
            echo "⚠️ unit test ফেল করেছে; তাই এটি pre-release, অ্যাপে আপডেট হিসেবে দেখাবে না।" >> "$NOTES_FILE"
            LATEST_FLAG="--prerelease"
          else
            LATEST_FLAG="--latest"
          fi

          gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
            --target "$GITHUB_SHA" \
            --title "Araaf Tractor Khata v${{ steps.apk.outputs.version_name }} (build ${VERSION_CODE})" \
            --notes-file "$NOTES_FILE" \
            "$LATEST_FLAG"

          if [[ "$TEST_OUTCOME" == "failure" ]]; then
            echo "### ⚠️ Release \`$TAG\` pre-release হিসেবে প্রকাশিত (unit test ফেল) — অ্যাপের আপডেটে আসবে না।" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 📦 Release \`$TAG\` প্রকাশিত হয়েছে — অ্যাপের ভেতর থেকে আপডেট করা যাবে।" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: ${{ steps.project.outputs.project_dir }}/app/build/reports
          if-no-files-found: ignore
          retention-days: 7
